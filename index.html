<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tacskó csapdás</title>
  <style>
    :root {
      --bg1: #dfeecb;
      --bg2: #c4e2b0;
      --grass: #6dbc62;
      --grass-dark: #488d45;
      --hole: #3d2f1d;
      --hole-shadow: #241a12;
      --gold: #ffd74d;
      --danger: #d94d4d;
      --text: #1d2b14;
      --panel: rgba(255, 255, 255, 0.24);
      --panel-border: rgba(19, 43, 19, 0.2);
      --btn: #ffb84d;
      --btn-dark: #d78814;
      --btn-text: #2d1d0d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    .game {
      width: min(92vw, 620px);
      background: rgba(255,255,255,0.15);
      border: 3px solid var(--panel-border);
      border-radius: 22px;
      box-shadow: 0 16px 40px rgba(30, 46, 26, 0.18);
      padding: 18px 18px 14px;
      backdrop-filter: blur(2px);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .stat small {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat strong {
      font-size: clamp(1.3rem, 4vw, 2rem);
      line-height: 1;
    }

    .stat.danger strong {
      color: var(--danger);
    }

    .board-wrap {
      position: relative;
      padding: 10px;
      border-radius: 18px;
      background: linear-gradient(180deg, #8ed36a, var(--grass));
      border: 3px solid rgba(42, 98, 36, 0.6);
      box-shadow: inset 0 -8px 0 rgba(40, 68, 31, 0.2);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      padding: 14px;
      background: linear-gradient(180deg, #a6d47c, #7cbc64);
      border-radius: 16px;
    }

    .hole {
      position: relative;
      height: 140px;
      background: radial-gradient(circle at 50% 22%, #674b2b 0%, var(--hole) 48%, var(--hole-shadow) 100%);
      border-radius: 50% 50% 46% 46% / 60% 60% 42% 42%;
      overflow: hidden;
      box-shadow: inset 0 10px 0 rgba(255,255,255,0.08), inset 0 -18px 12px rgba(0,0,0,0.22);
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease;
    }

    .hole:active {
      transform: scale(0.98);
    }

    .hole::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: 78%;
      height: 18px;
      background: rgba(0,0,0,0.22);
      border-radius: 50%;
      filter: blur(4px);
    }

    .dachshund {
      position: absolute;
      left: 50%;
      bottom: -60px;
      width: 85%;
      height: 80%;
      transform: translateX(-50%) translateY(100%);
      transition: transform 0.18s ease, opacity 0.15s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    .hole.active .dachshund {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Tacskó testépítészetei */
    .dachshund-body {
      position: absolute;
      left: 8%;
      top: 42%;
      width: 84%;
      height: 32%;
      background: linear-gradient(180deg, #2a2520 0%, #1a1410 100%);
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
      border: 2px solid #0a0805;
    }

    .dachshund-chest {
      position: absolute;
      left: 12%;
      top: 38%;
      width: 28%;
      height: 28%;
      background: linear-gradient(135deg, #3a3430 0%, #1a1410 100%);
      border-radius: 50%;
      box-shadow: inset -2px 2px 4px rgba(0,0,0,0.4);
      border: 1.5px solid #0a0805;
    }

    .dachshund-head {
      position: absolute;
      left: 6%;
      top: 24%;
      width: 26%;
      height: 40%;
      background: linear-gradient(180deg, #3a3430 0%, #1a1410 100%);
      border-radius: 50%;
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.5);
      border: 1.5px solid #0a0805;
      z-index: 3;
    }

    .dachshund-snout {
      position: absolute;
      left: 2%;
      top: 32%;
      width: 18%;
      height: 24%;
      background: linear-gradient(180deg, #4a4038 0%, #2a2218 100%);
      border-radius: 50%;
      box-shadow: inset 0 -2px 3px rgba(0,0,0,0.4);
      border: 1px solid #0a0805;
    }

    .dachshund-nose {
      position: absolute;
      left: 1%;
      top: 36%;
      width: 8px;
      height: 6px;
      background: #0a0805;
      border-radius: 50%;
      z-index: 4;
    }

    .dachshund-eye {
      position: absolute;
      width: 7px;
      height: 9px;
      background: #1a1410;
      border-radius: 50%;
      border: 1px solid #000;
      top: 28%;
      z-index: 4;
    }

    .dachshund-eye::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      top: 1px;
      left: 1px;
    }

    .dachshund-eye.left {
      left: 10%;
    }

    .dachshund-eye.right {
      left: 18%;
    }

    .dachshund-ear {
      position: absolute;
      background: linear-gradient(135deg, #2a2520 0%, #1a1410 100%);
      border-radius: 50%;
      border: 1px solid #0a0805;
      top: 22%;
    }

    .dachshund-ear.left {
      left: 8%;
      width: 12px;
      height: 16px;
      transform: rotate(-25deg);
    }

    .dachshund-ear.right {
      left: 22%;
      width: 12px;
      height: 16px;
      transform: rotate(25deg);
    }

    .dachshund-front-leg {
      position: absolute;
      bottom: 0;
      width: 10%;
      height: 32%;
      background: linear-gradient(90deg, #1a1410 0%, #2a2218 100%);
      border-radius: 50% 50% 0 0;
      border: 1px solid #0a0805;
    }

    .dachshund-front-leg.left {
      left: 18%;
    }

    .dachshund-front-leg.right {
      left: 32%;
    }

    .dachshund-back-leg {
      position: absolute;
      bottom: 0;
      width: 10%;
      height: 28%;
      background: linear-gradient(90deg, #1a1410 0%, #2a2218 100%);
      border-radius: 50% 50% 0 0;
      border: 1px solid #0a0805;
    }

    .dachshund-back-leg.left {
      left: 60%;
    }

    .dachshund-back-leg.right {
      left: 74%;
    }

    .dachshund-tail {
      position: absolute;
      right: 4%;
      top: 44%;
      width: 18%;
      height: 14%;
      background: linear-gradient(90deg, #1a1410 0%, #2a2218 100%);
      border-radius: 50%;
      box-shadow: inset -1px 1px 2px rgba(0,0,0,0.4);
      border: 1px solid #0a0805;
      transform-origin: left center;
      animation: tail-wag 0.6s ease-in-out infinite;
    }

    @keyframes tail-wag {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }

    .hole.shake {
      animation: shake 0.25s ease-in-out 2;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-3px); }
    }

    /* Kalapács */
    .hammer {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 32px;
      height: 32px;
      display: none;
    }

    .hammer.active {
      display: block;
    }

    .hammer-head {
      position: absolute;
      bottom: 0;
      left: 8px;
      width: 16px;
      height: 14px;
      background: linear-gradient(135deg, #8b6f47, #6b5237);
      border: 1px solid #3d2f1d;
      border-radius: 2px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.4);
    }

    .hammer-handle {
      position: absolute;
      bottom: 13px;
      left: 13px;
      width: 4px;
      height: 18px;
      background: linear-gradient(90deg, #8b6f47, #a0845a);
      border: 1px solid #5d4930;
      border-radius: 2px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--btn), var(--btn-dark));
      color: var(--btn-text);
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 22px;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(115, 74, 5, 0.35);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 rgba(115, 74, 5, 0.35);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(17, 25, 18, 0.48);
      border-radius: 16px;
      z-index: 9;
      backdrop-filter: blur(2px);
    }

    .overlay.visible {
      display: flex;
    }

    .overlay-card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 18px;
      padding: 22px 20px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 18px 28px rgba(0,0,0,0.2);
      border: 2px solid rgba(34, 56, 34, 0.12);
    }

    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      color: #1b2f1d;
    }

    .overlay-card p {
      margin: 6px 0;
      font-size: 1rem;
      color: #203622;
    }

    .status {
      margin-top: 12px;
      margin-bottom: 0;
      text-align: center;
      color: #2d3b2a;
      font-weight: 700;
      min-height: 24px;
    }

    @media (max-width: 540px) {
      .hud {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .board {
        gap: 12px;
      }

      .hole {
        height: 110px;
      }
    }
  </style>
</head>

  <script>
    const board = document.getElementById("board");
    const scoreEl = document.getElementById("score");
    const levelEl = document.getElementById("level");
    const missesEl = document.getElementById("misses");
    const bestEl = document.getElementById("best");
    const timeLeftEl = document.getElementById("timeLeft");
    const statusEl = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const finalScoreEl = document.getElementById("finalScore");
    const finalLevelEl = document.getElementById("finalLevel");
    const finalBestEl = document.getElementById("finalBest");
    const restartBtn = document.getElementById("restartBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const newGameBtn = document.getElementById("newGameBtn");
    const hammer = document.getElementById("hammer");

    const MAX_MISSES = 3;
    const HIGH_SCORE_KEY = "tacskoHighScore";
    const BASE_TIME = 60;

    let score = 0;
    let level = 1;
    let misses = 0;
    let highScore = Number(localStorage.getItem(HIGH_SCORE_KEY) || 0);
    let activeHole = null;
    let spawnTimer = null;
    let timeTimer = null;
    let timeLeft = BASE_TIME;
    let gameStarted = false;
    let gameOver = false;

    // Kalapács pozicionálása
    document.addEventListener("mousemove", (e) => {
      hammer.style.left = (e.clientX - 16) + "px";
      hammer.style.top = (e.clientY - 16) + "px";
    });

    // Kalapács animáció kattintáskor
    document.addEventListener("mousedown", (e) => {
      hammer.classList.add("active");
      hammer.style.transform = "rotate(45deg) scale(0.8)";
    });

    document.addEventListener("mouseup", () => {
      hammer.classList.remove("active");
      hammer.style.transform = "rotate(0deg) scale(1)";
    });

    function updateHUD() {
      scoreEl.textContent = String(score);
      levelEl.textContent = String(level);
      missesEl.textContent = `${misses}/${MAX_MISSES}`;
      bestEl.textContent = String(highScore);
      timeLeftEl.textContent = `${timeLeft}s`;

      // Vörös szín az idő alatt 10 másodperc
      if (timeLeft <= 10) {
        timeLeftEl.parentElement.classList.add("danger");
      } else {
        timeLeftEl.parentElement.classList.remove("danger");
      }
    }

    function saveHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      }
    }

    function pickRandomHole() {
      const holes = [...document.querySelectorAll(".hole")];
      const available = holes.filter(h => h !== activeHole && !h.classList.contains("active"));
      return available[Math.floor(Math.random() * available.length)];
    }

    function getSpawnDelay() {
      const base = 1200;
      const min = 350;
      return Math.max(min, base - (level - 1) * 110);
    }

    function hideMole() {
      if (activeHole) {
        activeHole.classList.remove("active");
        activeHole = null;
      }
    }

    function spawnMole() {
      if (gameOver || !gameStarted) return;

      hideMole();
      const nextHole = pickRandomHole();

      if (!nextHole) return;

      activeHole = nextHole;
      activeHole.classList.add("active");

      const life = Math.max(420, 950 - (level - 1) * 80);

      clearTimeout(spawnTimer);
      spawnTimer = setTimeout(() => {
        if (gameOver || !gameStarted) return;
        if (activeHole && activeHole.classList.contains("active")) {
          hideMole();
        }
        scheduleNextSpawn();
      }, life);
    }

    function scheduleNextSpawn() {
      clearTimeout(spawnTimer);
      if (!gameOver && gameStarted) {
        spawnTimer = setTimeout(spawnMole, getSpawnDelay());
      }
    }

    function increaseLevel() {
      level = 1 + Math.floor(score / 6);
    }

    function handleGoodHit(hole) {
      if (gameOver || !gameStarted) return;

      clearTimeout(spawnTimer);
      hole.classList.remove("active");
      activeHole = null;

      score += 1;
      saveHighScore();
      increaseLevel();
      updateHUD();

      statusEl.textContent = "Pofon a tacskónak! 💥";
      scheduleNextSpawn();
    }

    function handleBadHit(hole) {
      if (gameOver || !gameStarted) return;

      hole.classList.remove("active");
      hole.classList.remove("shake");
      void hole.offsetWidth;
      hole.classList.add("shake");

      misses += 1;
      updateHUD();

      statusEl.textContent = "Mellécsapás! Vigyázz!";

      if (misses >= MAX_MISSES) {
        endGame();
      }
    }

    function tickTime() {
      if (gameOver || !gameStarted) return;

      timeLeft -= 1;
      updateHUD();

      if (timeLeft <= 0) {
        endGame();
      }
    }

    function startTimer() {
      clearInterval(timeTimer);
      timeLeft = BASE_TIME;
      updateHUD();
      timeTimer = setInterval(tickTime, 1000);
    }

    function stopTimer() {
      clearInterval(timeTimer);
    }

    function endGame() {
      gameOver = true;
      gameStarted = false;
      clearTimeout(spawnTimer);
      stopTimer();
      hideMole();
      saveHighScore();
      updateHUD();

      finalScoreEl.textContent = `Pontszám: ${score}`;
      finalLevelEl.textContent = `Szint: ${level}`;
      finalBestEl.textContent = `Rekord: ${highScore}`;
      overlay.classList.add("visible");
      statusEl.textContent = "Az idő lejárt! Vagy megfogyott az életed...";

      startGameBtn.style.display = "inline-block";
      newGameBtn.style.display = "none";
    }

    function resetGame() {
      clearTimeout(spawnTimer);
      stopTimer();
      gameOver = false;
      gameStarted = false;
      score = 0;
      level = 1;
      misses = 0;
      timeLeft = BASE_TIME;
      hideMole();
      overlay.classList.remove("visible");
      statusEl.textContent = "Nyomj 'Játék indítása' gombra a kezdéshez!";
      updateHUD();

      startGameBtn.style.display = "inline-block";
      newGameBtn.style.display = "none";
    }

    function beginGame() {
      gameStarted = true;
      gameOver = false;
      score = 0;
      level = 1;
      misses = 0;
      timeLeft = BASE_TIME;
      updateHUD();
      overlay.classList.remove("visible");
      statusEl.textContent = "Csapj le a tacskókat!";

      startGameBtn.style.display = "none";
      newGameBtn.style.display = "inline-block";

      startTimer();
      scheduleNextSpawn();
    }

    document.querySelectorAll(".hole").forEach(hole => {
      hole.addEventListener("click", () => {
        if (gameOver || !gameStarted) return;

        if (hole.classList.contains("active")) {
          handleGoodHit(hole);
        } else {
          handleBadHit(hole);
        }
      });
    });

    restartBtn.addEventListener("click", beginGame);
    startGameBtn.addEventListener("click", beginGame);
    newGameBtn.addEventListener("click", resetGame);

    updateHUD();
  </script>
</body>
</html>
